name = "omauser"
main = "worker.js"
compatibility_date = "2025-01-01"

# Retention: device records carry a 1-year TTL in KV; no cron required.
[triggers]
crons = ["0 4 * * *"]

[[kv_namespaces]]
binding = "OMAUSER"
id = "20c5c367116944da82008526dbbced82"

# Local dev:  npx wrangler dev
# Deploy:     npx wrangler deploy
# After deploy, point the plugin at the worker:
#   omauser-setup.sh https://omauser.yesheytenzin09.workers.dev
