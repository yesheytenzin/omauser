name = "omauser"
main = "worker.js"
compatibility_date = "2025-01-01"

# Optional hardening: set HASH_SALT to pepper device hashes (e.g. `wrangler secret put HASH_SALT`)
# Optional scale: bind D1 as DB for strongly-consistent counters (free 5M reads/day)
#   wrangler d1 create omauser && wrangler d1 execute omauser --file schema.sql
# Retention: device records carry a 1-year TTL in KV; aggregate reconciled nightly.
[triggers]
crons = ["0 4 * * *"]

[[kv_namespaces]]
binding = "OMAUSER"
id = "20c5c367116944da82008526dbbced82"

# Local dev:  npx wrangler dev
# Deploy:     npx wrangler deploy
# After deploy, point the plugin at the worker:
#   omauser-setup.sh https://omauser.yesheytenzin09.workers.dev
